# dsh-lanmode bundle layer: applied automatically when the package is installed
# as a profile bundle (package.json declares dsh.bundle.patch).
#
# `name` must stay the full npm package name: the loader entry name is how the
# served bundle is resolved.
#
# DSH 0.1.7+: configuration lives directly in the profile row config below.
# The settings.register API was removed; the profile row is the single source
# of truth. Override values in your own profile patch as needed:
#
#   - id: dsh-lanmode
#     config:
#       mode: direct
#       directHost: '0.0.0.0'
#       directPort: 3080
#       tls: self-signed
#       allow:
#         - '192.168.1.0/24'
#
# Default config below is fail-closed: localhost-only, loopback allowlist.
# To enable network access, set directHost and allow in your profile.

# #241: Disable OS native directory chooser on remote/headless server
- id: directory-picker
  disabled: true

- insert:
    - id: dsh-lanmode
      name: '@goodandready/dsh-lanmode'
      config:
        mode: auto
        directHost: '127.0.0.1'
        directPort: 3088
        allow:
          - '127.0.0.0/8'

    # #241: Mount in-app browser directory picker backend and client UI dialog
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
      config:
        maxEntries: 1000

    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
